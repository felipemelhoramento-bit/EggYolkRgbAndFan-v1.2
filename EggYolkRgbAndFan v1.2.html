<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YolkFan Real-Time Analyzer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        
        /* Clippings internos para recorte da área de captura */
        .shape-circle { clip-path: circle(50% at 50% 50%); }
        .shape-square { clip-path: inset(0% 0% 0% 0%); }
        .shape-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .shape-pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
        .shape-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }

        .shape-transition {
            transition: clip-path 0.3s ease-in-out, width 0.1s ease-out, height 0.1s ease-out;
        }

        .no-scrollbar::-webkit-scrollbar { height: 4px; }
        .no-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full overflow-hidden flex flex-col select-none">

    <!-- Notificação Flutuante / Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/90 border border-slate-700 text-slate-200 px-4 py-2 rounded-xl shadow-2xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 text-sm flex items-center gap-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">Mensagem</span>
    </div>

    <!-- HEADER / BARRA SUPERIOR -->
    <header class="relative z-20 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 shadow-lg overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-2 shrink-0">
            <div class="bg-amber-500 p-2 rounded-xl text-slate-950 shadow-inner flex items-center justify-center w-8 h-8 font-extrabold">
                <i class="fa-solid fa-egg text-sm"></i>
            </div>
            <div class="hidden sm:block">
                <h1 class="font-bold text-xs tracking-wide bg-gradient-to-r from-amber-400 to-orange-400 bg-clip-text text-transparent">YolkFan Analyzer</h1>
                <p class="text-[9px] text-slate-400">Análise de Cor da Gema (1-16)</p>
            </div>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
            <!-- Seletor de Formas -->
            <div class="flex items-center gap-1.5 bg-slate-950/70 p-1 rounded-full border border-slate-800/80">
                <button onclick="setShape('circle')" id="btn-circle" class="shape-btn w-8 h-8 rounded-full flex items-center justify-center bg-amber-500 text-slate-950 font-bold shadow-md transition-all active:scale-95 hover:bg-amber-400" title="Círculo">
                    <div class="w-3.5 h-3.5 rounded-full bg-current"></div>
                </button>
                <button onclick="setShape('triangle')" id="btn-triangle" class="shape-btn w-8 h-8 rounded-full flex items-center justify-center bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all active:scale-95" title="Triângulo">
                    <div class="w-3.5 h-3.5 shape-triangle bg-current"></div>
                </button>
                <button onclick="setShape('square')" id="btn-square" class="shape-btn w-8 h-8 rounded-full flex items-center justify-center bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all active:scale-95" title="Quadrado">
                    <div class="w-3 h-3 rounded-sm bg-current"></div>
                </button>
                <button onclick="setShape('pentagon')" id="btn-pentagon" class="shape-btn w-8 h-8 rounded-full flex items-center justify-center bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all active:scale-95" title="Pentágono">
                    <div class="w-3.5 h-3.5 shape-pentagon bg-current"></div>
                </button>
                <button onclick="setShape('hexagon')" id="btn-hexagon" class="shape-btn w-8 h-8 rounded-full flex items-center justify-center bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all active:scale-95" title="Hexágono">
                    <div class="w-3.5 h-3.5 shape-hexagon bg-current"></div>
                </button>
            </div>

            <!-- Slider de Tamanho da FC -->
            <div class="flex items-center gap-1.5 bg-slate-950/70 px-2.5 py-1 rounded-xl border border-slate-800/80">
                <i class="fa-solid fa-compress text-[10px] text-slate-400" title="Reduzir"></i>
                <input type="range" id="size-slider" min="100" max="360" value="240" step="10" oninput="updateFCSize(this.value)" class="w-20 sm:w-28 accent-amber-500 cursor-pointer h-1 bg-slate-700 rounded-lg">
                <i class="fa-solid fa-expand text-[10px] text-slate-400" title="Expandir"></i>
                <span id="size-label" class="text-[10px] font-mono text-amber-400 w-7 text-right">240px</span>
            </div>

            <!-- Nível YolkFan Detectado -->
            <div class="flex items-center gap-1.5 bg-slate-950/70 px-2.5 py-1 rounded-xl border border-slate-800/80" title="Nível YolkFan Mais Próximo">
                <span class="text-[10px] font-medium text-slate-400 hidden md:inline">YolkFan:</span>
                <div class="flex items-center gap-1.5">
                    <div id="rec-color-box" class="w-5 h-5 rounded-md border border-slate-600 shadow-inner bg-black"></div>
                    <span id="rec-class-label" class="text-[11px] font-mono font-bold text-amber-400">Nível --</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="switchCamera()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-xl text-xs flex items-center justify-center border border-slate-700 transition-all" title="Alternar Câmera">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <button onclick="toggleFreeze()" id="freeze-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-xl text-xs flex items-center justify-center shadow-md transition-all" title="Congelar / Retomar">
                <i class="fa-solid fa-pause" id="freeze-icon"></i>
            </button>
        </div>
    </header>

    <!-- ÁREA CENTRAL -->
    <main class="relative flex-1 bg-slate-950 flex items-center justify-center overflow-hidden">
        <video id="webcam" autoplay playsinline muted class="hidden"></video>
        <canvas id="processing-canvas" class="hidden"></canvas>

        <div class="relative w-full h-full flex items-center justify-center bg-black">
            <canvas id="display-canvas" class="w-full h-full object-cover"></canvas>

            <!-- Figura Central com Borda SVG Dinâmica Inteiriça -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                <div id="central-figure-wrapper" style="width: 240px; height: 240px;" class="relative pointer-events-auto cursor-crosshair flex items-center justify-center">
                    
                    <!-- Borda SVG que desenha a linha contínua perfeita para qualquer forma -->
                    <svg id="central-svg-border" class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 100 100">
                        <circle id="svg-shape-element" cx="50" cy="50" r="48" fill="none" stroke="#22d3ee" stroke-width="2.5" />
                    </svg>

                    <!-- Área da imagem recortada -->
                    <div id="central-figure" class="w-full h-full shape-circle shape-transition bg-transparent overflow-hidden">
                        <canvas id="fc-canvas" class="hidden"></canvas>
                    </div>
                </div>
            </div>

            <div id="loading-overlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center gap-3 z-30 transition-opacity duration-500">
                <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-medium text-slate-300">Inicializando câmera e processador...</p>
                <button onclick="initCamera()" class="mt-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl shadow-md transition-all">
                    Permitir / Iniciar Manualmente
                </button>
            </div>
        </div>
    </main>

    <!-- PAINEL INFERIOR: RESULTADOS YOLKFAN -->
    <footer class="relative z-20 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-3 sm:p-4 shadow-2xl flex flex-col gap-3">
        <div class="flex items-center justify-between gap-2 max-w-full mx-auto w-full px-1">
            <div class="flex items-center gap-2">
                <div id="color-preview" class="w-6 h-6 rounded-lg border border-slate-600 shadow-inner bg-black" title="RGB Amostrado"></div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-slate-300">RGB Médio (FC):</span>
                    <span id="rgb-values" class="font-mono text-cyan-400 text-xs font-bold bg-slate-950 px-2 py-0.5 rounded border border-slate-800">R: 0 | G: 0 | B: 0</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div class="bg-slate-950/80 px-2.5 py-1 rounded-lg border border-slate-800 text-xs flex items-center gap-1.5">
                    <span class="text-slate-400">Pixels Amostrados:</span>
                    <span id="total-pixels-count" class="font-mono font-bold text-emerald-400">0</span>
                </div>
                <button onclick="copyValues()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1 rounded-lg border border-slate-700 flex items-center gap-1.5 transition-all">
                    <i class="fa-regular fa-copy"></i> Copiar
                </button>
            </div>
        </div>

        <div class="w-full bg-slate-950/90 border border-slate-800 rounded-xl p-3 shadow-inner flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="flex flex-col items-center justify-center bg-gradient-to-b from-amber-500 to-orange-600 text-slate-950 rounded-xl px-4 py-2 shadow-lg min-w-[75px]">
                    <span class="text-[9px] font-bold uppercase tracking-wider text-slate-900/80">Nível</span>
                    <span id="yf-level-display" class="text-2xl font-extrabold font-mono leading-none">--</span>
                </div>

                <div class="flex flex-col gap-0.5">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-slate-400">Cor Predominante:</span>
                        <span id="yf-color-name" class="text-sm font-bold text-amber-400">Aguardando leitura...</span>
                    </div>
                    <div class="flex items-center gap-2 text-[11px] font-mono text-slate-400">
                        <span>Referência LUT:</span>
                        <span id="yf-hex-code" class="text-slate-200 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-800">#------</span>
                        <span id="yf-rgb-ref" class="text-slate-400">(RGB: ---, ---, ---)</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 border-l border-slate-800 pl-3">
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[9px] text-slate-400">Padrão</span>
                    <div id="yf-lut-color-box" class="w-8 h-8 rounded-lg border border-slate-700 shadow-inner bg-black"></div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        let videoElement = document.getElementById('webcam');
        let displayCanvas = document.getElementById('display-canvas');
        let displayCtx = displayCanvas.getContext('2d', { willReadFrequently: true });
        let processingCanvas = document.getElementById('processing-canvas');
        let fcCanvas = document.getElementById('fc-canvas');
        let fcCtx = fcCanvas.getContext('2d', { willReadFrequently: true });

        let currentShape = 'circle';
        let currentFacingMode = 'user';
        let isFrozen = false;
        let animationFrameId = null;
        let lastR = 0, lastG = 0, lastB = 0;
        let currentYolkMatch = null;

        const YOLKFAN_TABLE = [
            { level: 1,  r: 255, g: 240, b: 160, hex: "#FFF0A0", name: "Amarelo Muito Pálido" },
            { level: 2,  r: 255, g: 230, b: 120, hex: "#FFE678", name: "Amarelo Pálido" },
            { level: 3,  r: 255, g: 222, b: 80,  hex: "#FFDE50", name: "Amarelo Claro" },
            { level: 4,  r: 255, g: 215, b: 40,  hex: "#FFD728", name: "Amarelo" },
            { level: 5,  r: 255, g: 205, b: 0,   hex: "#FFCD00", name: "Amarelo Gema Padrão" },
            { level: 6,  r: 255, g: 195, b: 0,   hex: "#FFC300", name: "Amarelo Intenso" },
            { level: 7,  r: 255, g: 185, b: 0,   hex: "#B9B900", name: "Amarelo Ouro (Base)" },
            { level: 8,  r: 255, g: 170, b: 0,   hex: "#FFAA00", name: "Laranja Claro" },
            { level: 9,  r: 255, g: 155, b: 0,   hex: "#FF9B00", name: "Laranja" },
            { level: 10, r: 255, g: 140, b: 0,   hex: "#FF8C00", name: "Laranja Intenso" },
            { level: 11, r: 255, g: 125, b: 0,   hex: "#FF7D00", name: "Laranja Escuro" },
            { level: 12, r: 255, g: 110, b: 0,   hex: "#FF6E00", name: "Laranja Avermelhado (Pref. Global)" },
            { level: 13, r: 255, g: 95,  b: 0,   hex: "#FF5F00", name: "Laranja Avermelhado Escuro" },
            { level: 14, r: 250, g: 80,  b: 0,   hex: "#FA5000", name: "Vermelho Alaranjado" },
            { level: 15, r: 240, g: 65,  b: 0,   hex: "#F04100", name: "Vermelho Alaranjado Intenso" },
            { level: 16, r: 230, g: 50,  b: 0,   hex: "#E63200", name: "Laranja Profundo / Avermelhado" }
        ];

        window.addEventListener('load', () => {
            initCamera();
        });

        async function initCamera() {
            const loadingOverlay = document.getElementById('loading-overlay');
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    });
                    videoElement.srcObject = stream;
                    videoElement.onloadedmetadata = () => {
                        videoElement.play();
                        resizeCanvases();
                        loadingOverlay.style.opacity = '0';
                        setTimeout(() => loadingOverlay.classList.add('hidden'), 500);
                        if (!animationFrameId) requestAnimationFrame(processFrame);
                        showToast('Câmera conectada com sucesso!', 'success');
                    };
                }
            } catch (err) {
                console.error(err);
                showToast('Erro ao acessar a câmera.', 'error');
            }
        }

        function resizeCanvases() {
            if (!videoElement.videoWidth) return;
            displayCanvas.width = videoElement.videoWidth;
            displayCanvas.height = videoElement.videoHeight;
            processingCanvas.width = videoElement.videoWidth;
            processingCanvas.height = videoElement.videoHeight;
            fcCanvas.width = 300;
            fcCanvas.height = 300;
        }

        window.addEventListener('resize', resizeCanvases);

        function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            if (videoElement.srcObject) videoElement.srcObject.getTracks().forEach(t => t.stop());
            initCamera();
        }

        function updateFCSize(sizeVal) {
            const centralWrapper = document.getElementById('central-figure-wrapper');
            centralWrapper.style.width = `${sizeVal}px`;
            centralWrapper.style.height = `${sizeVal}px`;
            document.getElementById('size-label').textContent = `${sizeVal}px`;
        }

        // Atualização dinâmica da borda SVG de cada polígono/forma
        function setShape(shape) {
            currentShape = shape;
            const centralFigure = document.getElementById('central-figure');
            const svgContainer = document.getElementById('central-svg-border');
            
            centralFigure.className = `w-full h-full shape-${shape} shape-transition bg-transparent overflow-hidden`;

            // Gerar o elemento SVG exato para contorno 100% contínuo
            if (shape === 'circle') {
                svgContainer.innerHTML = `<circle cx="50" cy="50" r="48" fill="none" stroke="#22d3ee" stroke-width="2.5" />`;
            } else if (shape === 'square') {
                svgContainer.innerHTML = `<rect x="1.5" y="1.5" width="97" height="97" fill="none" stroke="#22d3ee" stroke-width="2.5" />`;
            } else if (shape === 'triangle') {
                svgContainer.innerHTML = `<polygon points="50,1.5 1.5,98.5 98.5,98.5" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" />`;
            } else if (shape === 'pentagon') {
                svgContainer.innerHTML = `<polygon points="50,1.5 98.5,37 80.5,98.5 19.5,98.5 1.5,37" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" />`;
            } else if (shape === 'hexagon') {
                svgContainer.innerHTML = `<polygon points="25,1.5 75,1.5 98.5,50 75,98.5 25,98.5 1.5,50" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" />`;
            }

            document.querySelectorAll('.shape-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-slate-950', 'shadow-md', 'font-bold');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            const activeBtn = document.getElementById(`btn-${shape}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
                activeBtn.classList.add('bg-amber-500', 'text-slate-950', 'shadow-md', 'font-bold');
            }
            showToast(`Forma: ${shape.toUpperCase()}`, 'info');
        }

        function toggleFreeze() {
            isFrozen = !isFrozen;
            const freezeBtn = document.getElementById('freeze-btn');
            const freezeIcon = document.getElementById('freeze-icon');
            if (isFrozen) {
                freezeBtn.classList.replace('bg-emerald-600', 'bg-amber-600');
                freezeIcon.classList.replace('fa-pause', 'fa-play');
                showToast('Amostra congelada.', 'info');
            } else {
                freezeBtn.classList.replace('bg-amber-600', 'bg-emerald-600');
                freezeIcon.classList.replace('fa-play', 'fa-pause');
                showToast('Amostragem retomada.', 'success');
                requestAnimationFrame(processFrame);
            }
        }

        function processFrame() {
            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA && !isFrozen) {
                const vW = videoElement.videoWidth;
                const vH = videoElement.videoHeight;
                if (displayCanvas.width !== vW || displayCanvas.height !== vH) resizeCanvases();

                displayCtx.drawImage(videoElement, 0, 0, vW, vH);

                const rect = document.getElementById('central-figure').getBoundingClientRect();
                const containerRect = displayCanvas.getBoundingClientRect();
                const scaleX = vW / containerRect.width;
                const scaleY = vH / containerRect.height;

                const srcX = (rect.left - containerRect.left) * scaleX;
                const srcY = (rect.top - containerRect.top) * scaleY;
                const srcW = rect.width * scaleX;
                const srcH = rect.height * scaleY;

                fcCtx.clearRect(0, 0, fcCanvas.width, fcCanvas.height);
                fcCtx.drawImage(videoElement, srcX, srcY, srcW, srcH, 0, 0, fcCanvas.width, fcCanvas.height);

                processYolkFanAnalysis(fcCtx, fcCanvas.width, fcCanvas.height, currentShape);
            }
            if (!isFrozen) animationFrameId = requestAnimationFrame(processFrame);
        }

        function processYolkFanAnalysis(ctx, width, height, shape) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            let totalR = 0, totalG = 0, totalB = 0, totalValidPixels = 0;
            const cx = width / 2;
            const cy = height / 2;
            const radius = width / 2;

            const step = 2;
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    let inside = false;

                    if (shape === 'circle') {
                        const dx = x - cx, dy = y - cy;
                        if ((dx * dx + dy * dy) <= (radius * radius)) inside = true;
                    } else if (shape === 'square') {
                        inside = true;
                    } else if (shape === 'triangle') {
                        const denom = (height)*(cx - width) + (width)*(0 - height);
                        const a = ((height)*(x - width) + (width)*(y - height)) / denom;
                        const b = ((0 - height)*(x - width) + (cx - width)*(y - height)) / denom;
                        if (a >= 0 && b >= 0 && (1 - a - b) >= 0) inside = true;
                    } else if (shape === 'pentagon' || shape === 'hexagon') {
                        const sides = shape === 'pentagon' ? 5 : 6;
                        const angle = Math.atan2(y - cy, x - cx);
                        const dist = Math.hypot(x - cx, y - cy);
                        const rPolygon = radius * (Math.cos(Math.PI / sides) / Math.cos((angle % (2 * Math.PI / sides)) - (Math.PI / sides)));
                        if (dist <= rPolygon) inside = true;
                    }

                    if (inside) {
                        const index = (y * width + x) * 4;
                        totalR += data[index];
                        totalG += data[index + 1];
                        totalB += data[index + 2];
                        totalValidPixels++;
                    }
                }
            }

            if (totalValidPixels > 0) {
                lastR = Math.round(totalR / totalValidPixels);
                lastG = Math.round(totalG / totalValidPixels);
                lastB = Math.round(totalB / totalValidPixels);
            } else {
                lastR = 0; lastG = 0; lastB = 0;
            }

            document.getElementById('rgb-values').textContent = `R: ${lastR} | G: ${lastG} | B: ${lastB}`;
            document.getElementById('color-preview').style.backgroundColor = `rgb(${lastR}, ${lastG}, ${lastB})`;
            document.getElementById('total-pixels-count').textContent = totalValidPixels;

            let closestItem = YOLKFAN_TABLE[0];
            let minDistance = Infinity;

            for (let i = 0; i < YOLKFAN_TABLE.length; i++) {
                const item = YOLKFAN_TABLE[i];
                const dist = Math.sqrt(
                    Math.pow(lastR - item.r, 2) +
                    Math.pow(lastG - item.g, 2) +
                    Math.pow(lastB - item.b, 2)
                );
                if (dist < minDistance) {
                    minDistance = dist;
                    closestItem = item;
                }
            }

            currentYolkMatch = closestItem;

            document.getElementById('yf-level-display').textContent = closestItem.level;
            document.getElementById('yf-color-name').textContent = closestItem.name;
            document.getElementById('yf-hex-code').textContent = closestItem.hex;
            document.getElementById('yf-rgb-ref').textContent = `(RGB: ${closestItem.r}, ${closestItem.g}, ${closestItem.b})`;
            document.getElementById('yf-lut-color-box').style.backgroundColor = closestItem.hex;

            document.getElementById('rec-class-label').textContent = `Nível ${closestItem.level}`;
            document.getElementById('rec-color-box').style.backgroundColor = closestItem.hex;
        }

        function copyValues() {
            if (!currentYolkMatch) return;
            let report = `YolkFan Real-Time Analyzer - Relatório de Cor\n`;
            report += `----------------------------------------\n`;
            report += `Nível YolkFan: ${currentYolkMatch.level}\n`;
            report += `Descrição: ${currentYolkMatch.name}\n`;
            report += `HEX Ref.: ${currentYolkMatch.hex} | RGB Ref.: (${currentYolkMatch.r}, ${currentYolkMatch.g}, ${currentYolkMatch.b})\n`;
            report += `RGB Capturado (FC): R:${lastR} G:${lastG} B:${lastB}\n`;
            report += `Forma FC: ${currentShape.toUpperCase()}\n`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(report).then(() => showToast('Relatório copiado!', 'success'));
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.replace('opacity-0', 'opacity-100');
            toast.classList.remove('pointer-events-none');
            setTimeout(() => {
                toast.classList.replace('opacity-100', 'opacity-0');
                toast.classList.add('pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
